apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: kubero-system
type: Opaque
data:
  # Replace with your base64-encoded Cloudflare API token
  # Generate with: echo -n "your-token" | base64
  token: <YOUR_BASE64_ENCODED_TOKEN>

# Example for AWS:
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: aws-credentials
#   namespace: kubero-system
# type: Opaque
# data:
#   access-key: <YOUR_BASE64_ENCODED_AWS_ACCESS_KEY>
#   secret-key: <YOUR_BASE64_ENCODED_AWS_SECRET_KEY>

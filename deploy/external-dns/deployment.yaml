apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: kubero-system
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.13.5
        args:
        - --source=service
        - --source=ingress
        - --domain-filter=kubero.example.com # Replace with your domain
        - --provider=cloudflare # Replace with your DNS provider
        - --policy=upsert-only # Prevent ExternalDNS from deleting any records
        - --registry=txt
        - --txt-owner-id=kubero
        env:
        # Set your provider-specific environment variables here
        # For Cloudflare:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: token
        # For AWS Route53:
        # - name: AWS_ACCESS_KEY_ID
        #   valueFrom:
        #     secretKeyRef:
        #       name: aws-credentials
        #       key: access-key
        # - name: AWS_SECRET_ACCESS_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: aws-credentials
        #       key: secret-key
        resources:
          limits:
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 50Mi
